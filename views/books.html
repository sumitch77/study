<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books - Highkey</title>
    <link rel="stylesheet" href="/output.css" />
     <style type="text/tailwindcss">
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }
 
      @utility shimmer {
        position: relative;
        overflow: hidden;
 
        &::before {
          content: "";
          position: absolute;
          inset: 0;
          transform: translateX(-100%);
          animation: shimmer 1.6s infinite;
          background-image: linear-gradient(
            90deg,
            transparent,
            rgb(255 255 255 / 0.08),
            transparent
          );
        }
      }
    </style>
  </head>
  <body>
    <div class="flex min-h-screen bg-neutral-950 text-white">
      <!-- desktop sidebar -->
      <aside id="desktopSidebar" class="sticky top-0 hidden h-screen w-60 shrink-0 flex-col border-r border-white/5 bg-black/40 md:flex"></aside>

      <!-- mobile sidebar overlay (half of the page) -->
      <div id="mobileOverlay" class="fixed inset-0 z-40 hidden md:hidden">
        <div id="overlayBackdrop" class="absolute inset-0 bg-black/60"></div>
        <aside class="relative flex h-full w-1/2 min-w-56 flex-col border-r border-white/10 bg-neutral-950/95 backdrop-blur-xl">
          <button id="closeSidebar" type="button" aria-label="Close menu" class="absolute top-5 right-4 cursor-pointer text-neutral-400 transition hover:text-white">
            <span data-icon="close" data-class="h-5 w-5"></span>
          </button>
          <div id="mobileSidebarContent" class="flex h-full flex-col"></div>
        </aside>
      </div>

      <!-- right side -->
      <div class="flex min-w-0 flex-1 flex-col">
        <!-- top bar -->
        <header class="flex items-center justify-between gap-4 border-b border-white/5 px-6 py-4">
          <div class="flex min-w-0 flex-1 items-center gap-3">
            <button id="openSidebar" type="button" aria-label="Open menu" class="cursor-pointer text-neutral-300 transition hover:text-white md:hidden">
              <span data-icon="menu" data-class="h-6 w-6"></span>
            </button>

            <div class="relative w-full max-w-md">
              <span class="absolute top-1/2 left-3 -translate-y-1/2 text-neutral-500">
                <span data-icon="search" data-class="h-4 w-4"></span>
              </span>
              <input
                type="text"
                placeholder="Search books, notes, questions..."
                class="w-full rounded-lg border border-white/10 bg-black/40 py-2.5 pr-3 pl-10 text-sm text-white placeholder-neutral-500 outline-none transition focus:border-white/30"
              />
            </div>
          </div>

          <div class="flex items-center gap-4">
            <a href="#" class="flex items-center gap-2 rounded-lg bg-linear-to-b from-white to-slate-200 px-4 py-2 text-sm font-medium whitespace-nowrap text-black transition hover:from-slate-100 hover:to-slate-300">
              <span data-icon="crown" data-class="h-4 w-4"></span>
              <span class="hidden sm:inline">Get Premium</span>
            </a>

            <!-- profile -->
            <div class="relative" id="profileWrap">
              <button id="profileBtn" type="button" aria-label="Open profile menu" class="flex cursor-pointer items-center gap-1 text-neutral-400 transition hover:text-white">
                <span id="avatar" class="flex h-9 w-9 items-center justify-center rounded-full border border-white/10 bg-neutral-900 text-sm font-medium text-white"></span>
                <span data-icon="chevron" data-class="h-4 w-4"></span>
              </button>

              <div id="profileMenu" class="absolute right-0 z-20 mt-2 hidden w-64 rounded-xl border border-white/10 bg-neutral-900/90 p-4 shadow-2xl shadow-black/50 backdrop-blur-xl">
                <p id="userName" class="text-sm md:text-base font-medium text-white"></p>
                <p id="userEmail" class="mt-1 text-xs md:text-base break-all text-neutral-400"></p>
                <button id="logoutBtn" type="button" class="mt-4 w-full cursor-pointer rounded-lg bg-red-600 py-2 text-sm font-medium text-white transition hover:bg-red-500">
                <a href="/logout"> Logout</a> 
                </button>
              </div>
            </div>
          </div>
        </header>

        <!-- content -->
        <main class="flex-1 px-6 py-8">
<div id="shimmer">

               
    <!-- ===== copy from here ===== -->
    <main class="flex-1 px-6 py-8" aria-busy="true" aria-label="Loading">
      <!-- "Good morning" heading -->
      <div class="shimmer h-9 w-56 max-w-full rounded-lg bg-white/10"></div>
 
      <!-- tagline -->
      <div class="shimmer mt-3 mb-8 h-4 w-96 max-w-full rounded-md bg-white/5"></div>
 
      <!-- subject cards (same grid as the real page) -->
      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3">
        <!-- repeat once per card (5 here) -->
        <div class="shimmer flex h-55 flex-col justify-between rounded-3xl border border-white/10 bg-neutral-900/70 p-6 shadow-2xl shadow-black/50">
          <div class="flex items-start justify-between">
            <div class="h-11 w-11 rounded-xl bg-white/10"></div>
            <div class="h-4 w-4 rounded bg-white/10"></div>
          </div>
          <div class="h-6 w-40 rounded-md bg-white/10"></div>
        </div>
 
        <div class="shimmer flex h-55 flex-col justify-between rounded-3xl border border-white/10 bg-neutral-900/70 p-6 shadow-2xl shadow-black/50">
          <div class="flex items-start justify-between">
            <div class="h-11 w-11 rounded-xl bg-white/10"></div>
            <div class="h-4 w-4 rounded bg-white/10"></div>
          </div>
          <div class="h-6 w-24 rounded-md bg-white/10"></div>
        </div>
 
        <div class="shimmer flex h-55 flex-col justify-between rounded-3xl border border-white/10 bg-neutral-900/70 p-6 shadow-2xl shadow-black/50">
          <div class="flex items-start justify-between">
            <div class="h-11 w-11 rounded-xl bg-white/10"></div>
            <div class="h-4 w-4 rounded bg-white/10"></div>
          </div>
          <div class="h-6 w-28 rounded-md bg-white/10"></div>
        </div>
 
        <div class="shimmer flex h-55 flex-col justify-between rounded-3xl border border-white/10 bg-neutral-900/70 p-6 shadow-2xl shadow-black/50">
          <div class="flex items-start justify-between">
            <div class="h-11 w-11 rounded-xl bg-white/10"></div>
            <div class="h-4 w-4 rounded bg-white/10"></div>
          </div>
          <div class="h-6 w-24 rounded-md bg-white/10"></div>
        </div>
 
        <div class="shimmer flex h-55 flex-col justify-between rounded-3xl border border-white/10 bg-neutral-900/70 p-6 shadow-2xl shadow-black/50">
          <div class="flex items-start justify-between">
            <div class="h-11 w-11 rounded-xl bg-white/10"></div>
            <div class="h-4 w-4 rounded bg-white/10"></div>
          </div>
          <div class="h-6 w-20 rounded-md bg-white/10"></div>
        </div>
      </div>
    </main>
</div>
    <div id="aftershimmer" class="hidden">
          <h1 class="text-3xl font-semibold tracking-tight">Good morning</h1>
          <p class="mt-2 mb-8 text-sm text-neutral-400">“A little learning every day opens a world of possibilities.”</p>

          <div id="subjectGrid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3"></div>
    </div>

        </main>

        <!-- footer -->
        <footer class="flex flex-wrap items-center justify-between gap-3 border-t border-white/5 px-6 py-5 text-xs text-neutral-500">
          <p>© 2026 Highkey. All rights reserved.</p>
          <div id="footerLinks" class="flex flex-wrap gap-6"></div>
        </footer>
      </div>
      </div>
    

    <script>
      // Set this to your backend URL (same as the other pages)
      const skimmer = document.getElementById("shimmer");
      const afterskimmer = document.getElementById("aftershimmer");

      // ---------- icons ----------
      const icons = {
        home: `<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />`,
        book: `<path d="M12 7v14" /><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />`,
        notes: `<path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4" /><path d="M2 6h4" /><path d="M2 10h4" /><path d="M2 14h4" /><path d="M2 18h4" /><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" />`,
        help: `<circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" />`,
        test: `<rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="m9 14 2 2 4-4" />`,
        copy: `<rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />`,
        support: `<circle cx="12" cy="12" r="10" /><path d="m4.93 4.93 4.24 4.24" /><path d="m14.83 9.17 4.24-4.24" /><path d="m14.83 14.83 4.24 4.24" /><path d="m9.17 14.83-4.24 4.24" /><circle cx="12" cy="12" r="4" />`,
        search: `<circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />`,
        crown: `<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" /><path d="M5 21h14" />`,
        chevron: `<path d="m6 9 6 6 6-6" />`,
        arrow: `<path d="M7 7h10v10" /><path d="M7 17 17 7" />`,
        menu: `<path d="M4 6h16" /><path d="M4 12h16" /><path d="M4 18h16" />`,
        close: `<path d="M18 6 6 18" /><path d="m6 6 12 12" />`,
        globe: `<circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" />`,
        calculator: `<rect width="16" height="20" x="4" y="2" rx="2" /><line x1="8" x2="16" y1="6" y2="6" /><line x1="16" x2="16" y1="14" y2="18" /><path d="M16 10h.01" /><path d="M12 10h.01" /><path d="M8 10h.01" /><path d="M12 14h.01" /><path d="M8 14h.01" /><path d="M12 18h.01" /><path d="M8 18h.01" />`,
        flask: `<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2" /><path d="M8.5 2h7" /><path d="M7 16h10" />`,
      };

      function icon(name, cls = "h-5 w-5") {
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${icons[name]}</svg>`;
      }

      // ---------- navigation ----------
      // current page path, without a trailing slash ("/" stays "/")
      const pathname = window.location.pathname.replace(/\/+$/, "") || "/";

      // the item whose href matches the current page gets highlighted
      const navItems = [
        { label: "Home", icon: "home", href: "/" },
        { label: "Books", icon: "book", href: "/books" },
        { label: "Notes", icon: "notes", href: "/notes" },
        { label: "Practice Questions", icon: "help", href: "/practice" },
        { label: "Test", icon: "test", href: "/test" },
        { label: "PYQ", icon: "copy", href: "/pyq" },
      ];

      // ---------- data ----------
      const subjects = [
        { title: "Social Science", icon: "globe", href: "#", bg: "/assets/sst.png" },
        { title: "Maths", icon: "calculator", href: "#", bg: "/assets/maths.png" },
        { title: "Science", icon: "flask", href: "#", bg: "/assets/science.png" },
        { title: "English", text: "Aa", href: "#", bg: "/assets/eng.png" },
        { title: "Hindi", text: "अ", href: "#", bg: "/assets/hindi.png" },
      ];
      

      const footerLinks = ["About us", "Contact", "Privacy Policy", "Terms and Conditions"];

      // ---------- render ----------
      function sidebarHTML() {
        const items = navItems
          .map((item) =>
            item.href === pathname
              ? `<a href="${item.href}" class="flex items-center gap-3 rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-medium text-white">${icon(item.icon, "h-4 w-4 text-indigo-300")}${item.label}</a>`
              : `<a href="${item.href}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-neutral-400 transition hover:bg-white/5 hover:text-white">${icon(item.icon, "h-4 w-4")}${item.label}</a>`,
          )
          .join("");

        return `
          <div class="flex items-center gap-2 px-5 py-5">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" class="h-6 w-6">
              <path d="M12 3 2.5 21h19L12 3Z" />
              <path d="m12 9-4 12M12 9l4 12" />
            </svg>
            <span class="text-xl font-medium tracking-tight">Highkey</span>
          </div>
          <nav class="flex flex-col gap-1 px-3 py-2">
            ${items}
            <div class="my-2 border-t border-white/5"></div>
            <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-neutral-400 transition hover:bg-white/5 hover:text-white">${icon("support", "h-4 w-4")}Help</a>
          </nav>
          <p class="mt-auto px-5 py-5 text-xs text-neutral-500">Your space for what’s next.</p>`;
      } 

      document.getElementById("desktopSidebar").innerHTML = sidebarHTML();
      document.getElementById("mobileSidebarContent").innerHTML = sidebarHTML();

      document.getElementById("subjectGrid").innerHTML = subjects
        .map((s) => {
          const iconHTML = s.text
            ? `<span class="text-lg leading-none font-semibold">${s.text}</span>`
            : icon(s.icon, "h-5 w-5");

          return `
          <a href="${s.href}" class="group relative flex h-55 flex-col justify-between overflow-hidden rounded-3xl border border-white/10 bg-linear-to-b from-neutral-800/60 via-neutral-950 to-neutral-900 p-6 shadow-2xl shadow-black/50 transition hover:border-white/20">
            <!-- background image: change the src in the subjects list above -->
            <img src="${s.bg}" alt="" loading="eager" class="absolute inset-0 h-full w-full object-cover opacity-30 transition duration-300 group-hover:scale-105 group-hover:opacity-40" />
            <div class="absolute inset-0 bg-linear-to-t from-black/70 via-black/20 to-transparent"></div>

            <div class="relative flex items-start justify-between">
              <span class="flex h-11 w-11 items-center justify-center rounded-xl border border-white/10 bg-black/40 text-indigo-300 backdrop-blur-md">${iconHTML}</span>
              <span class="text-neutral-400 transition group-hover:text-white">${icon("arrow", "h-4 w-4")}</span>
            </div>

            <h3 class="relative text-xl font-medium">${s.title}</h3>
          </a>`;
        })
        .join("");

      document.getElementById("footerLinks").innerHTML = footerLinks
        .map((label) => `<a href="#" class="transition hover:text-white">${label}</a>`)
        .join("");

      // fill the static icon placeholders
      document.querySelectorAll("[data-icon]").forEach((el) => {
        el.innerHTML = icon(el.dataset.icon, el.dataset.class);
      });

      // ---------- mobile sidebar ----------
      const overlay = document.getElementById("mobileOverlay");
      const openSidebar = () => overlay.classList.remove("hidden");
      const closeSidebar = () => overlay.classList.add("hidden");

      document.getElementById("openSidebar").addEventListener("click", openSidebar);
      document.getElementById("closeSidebar").addEventListener("click", closeSidebar);
      document.getElementById("overlayBackdrop").addEventListener("click", closeSidebar);
      document
        .getElementById("mobileSidebarContent")
        .querySelectorAll("a")
        .forEach((a) => a.addEventListener("click", closeSidebar));

      // ---------- profile menu ----------
      const profileWrap = document.getElementById("profileWrap");
      const profileMenu = document.getElementById("profileMenu");

      document.getElementById("profileBtn").addEventListener("click", () => {
        profileMenu.classList.toggle("hidden");
      });

      // close the profile menu when clicking anywhere outside it
      document.addEventListener("mousedown", (e) => {
        if (!profileWrap.contains(e.target)) profileMenu.classList.add("hidden");
      });

      // ---------- user info ----------
      async function getUserInfo() {
        try {
          const res = await fetch(`/userinfo`);
          const data = await res.json();

          if (!data.success) {
            window.location.href = '/login';
            return;
          }
        shimmer.classList.add("hidden");
        aftershimmer.classList.remove("hidden");
          document.getElementById("userName").textContent = data.username;
          document.getElementById("userEmail").textContent = data.useremail;
          document.getElementById("avatar").textContent = data.username
            ? data.username.charAt(0).toUpperCase()
            : "";
        } catch (err) {
          console.error("Could not load user info", err);
        }
      }
      getUserInfo();

  
    </script>
  </body>
</html>
