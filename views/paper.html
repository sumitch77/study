<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice Paper - Highkey</title>
    <link rel="stylesheet" href="/output.css" />
    <style type="text/tailwindcss">
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      @utility shimmer {
        position: relative;
        overflow: hidden;

        &::before {
          content: "";
          position: absolute;
          inset: 0;
          transform: translateX(-100%);
          animation: shimmer 1.6s infinite;
          background-image: linear-gradient(
            90deg,
            transparent,
            rgb(255 255 255 / 0.08),
            transparent
          );
        }
      }
    </style>
  </head>
  <body>
    <div class="flex min-h-screen bg-neutral-950 text-white">
      <!-- desktop sidebar -->
      <aside
        id="desktopSidebar"
        class="sticky top-0 hidden h-screen w-60 shrink-0 flex-col border-r border-white/5 bg-black/40 md:flex"
      ></aside>

      <!-- mobile sidebar overlay (half of the page) -->
      <div id="mobileOverlay" class="fixed inset-0 z-40 hidden md:hidden">
        <div id="overlayBackdrop" class="absolute inset-0 bg-black/60"></div>
        <aside
          class="relative flex h-full w-1/2 min-w-56 flex-col border-r border-white/10 bg-neutral-950/95 backdrop-blur-xl"
        >
          <button
            id="closeSidebar"
            type="button"
            aria-label="Close menu"
            class="absolute top-5 right-4 cursor-pointer text-neutral-400 transition hover:text-white"
          >
            <span data-icon="close" data-class="h-5 w-5"></span>
          </button>
          <div id="mobileSidebarContent" class="flex h-full flex-col"></div>
        </aside>
      </div>

      <!-- right side -->
      <div class="flex min-w-0 flex-1 flex-col">
        <!-- top bar -->
        <header
          class="flex items-center justify-between gap-4 border-b border-white/5 px-6 py-4"
        >
          <div class="flex min-w-0 flex-1 items-center gap-3">
            <button
              id="openSidebar"
              type="button"
              aria-label="Open menu"
              class="cursor-pointer text-neutral-300 transition hover:text-white md:hidden"
            >
              <span data-icon="menu" data-class="h-6 w-6"></span>
            </button>

            <div class="relative w-full max-w-md">
              <span
                class="absolute top-1/2 left-3 -translate-y-1/2 text-neutral-500"
              >
                <span data-icon="search" data-class="h-4 w-4"></span>
              </span>
              <input
                id="searchInput"
                type="search"
                autocomplete="off"
                placeholder="Search questions in this paper..."
                class="w-full rounded-lg border border-white/10 bg-black/40 py-2.5 pr-3 pl-10 text-sm text-white placeholder-neutral-500 outline-none transition focus:border-white/30"
              />
            </div>
          </div>

          <div class="flex items-center gap-4">
            <a
              href="#"
              class="flex items-center gap-2 rounded-lg bg-linear-to-b from-white to-slate-200 px-4 py-2 text-sm font-medium whitespace-nowrap text-black transition hover:from-slate-100 hover:to-slate-300"
            >
              <span data-icon="crown" data-class="h-4 w-4"></span>
              <span class="hidden sm:inline">Get Premium</span>
            </a>

            <!-- profile -->
            <div class="relative" id="profileWrap">
              <button
                id="profileBtn"
                type="button"
                aria-label="Open profile menu"
                class="flex cursor-pointer items-center gap-1 text-neutral-400 transition hover:text-white"
              >
                <span
                  id="avatar"
                  class="flex h-9 w-9 items-center justify-center rounded-full border border-white/10 bg-neutral-900 text-sm font-medium text-white"
                ></span>
                <span data-icon="chevron" data-class="h-4 w-4"></span>
              </button>

              <div
                id="profileMenu"
                class="absolute right-0 z-20 mt-2 hidden w-64 rounded-xl border border-white/10 bg-neutral-900/90 p-4 shadow-2xl shadow-black/50 backdrop-blur-xl"
              >
                <p
                  id="userName"
                  class="text-sm font-medium text-white md:text-base"
                ></p>
                <p
                  id="userEmail"
                  class="mt-1 text-xs break-all text-neutral-400 md:text-base"
                ></p>
                <a
                  href="/logout"
                  class="mt-4 block w-full cursor-pointer rounded-lg bg-red-600 py-2 text-center text-sm font-medium text-white transition hover:bg-red-500"
                  >Logout</a
                >
              </div>
            </div>
          </div>
        </header>

        <!-- content -->
        <main class="flex-1 px-6 py-8">
          <!-- loading state: shown until /getpaperpractice finishes -->
          <div id="shimmer" aria-busy="true" aria-label="Loading questions">
            <div
              class="shimmer h-9 w-64 max-w-full rounded-lg bg-white/10"
            ></div>
            <div class="shimmer mt-3 h-4 w-48 max-w-full rounded-md bg-white/5"></div>
            <div id="pageSkeletonList" class="mx-auto mt-8 flex max-w-3xl flex-col gap-4"></div>
          </div>

          <!-- real content -->
          <div id="aftershimmer" class="hidden">
            <a
              href="/ssc"
              class="mb-4 inline-flex items-center gap-1 text-sm text-neutral-400 transition hover:text-white"
              >← Back to practice</a
            >
            <h1 class="text-3xl font-semibold tracking-tight">Practice Paper</h1>
            <p
              id="paperMeta"
              class="mt-2 text-sm text-neutral-400 capitalize"
            ></p>

            <!-- empty / error message -->
            <p
              id="paperMessage"
              class="mt-6 hidden max-w-3xl rounded-2xl border border-white/10 bg-white/5 px-5 py-4 text-sm text-neutral-300"
            ></p>

            <div id="paperBody" class="hidden">
              <!-- progress -->
              <div
                class="mt-6 flex max-w-3xl flex-wrap items-center justify-between gap-3 rounded-2xl border border-white/10 bg-white/5 px-5 py-3 text-sm"
              >
                <span class="text-neutral-300"
                  >Answered
                  <span id="answeredCount" class="font-semibold text-white">0</span>
                  / <span id="totalCount">0</span></span
                >
                <span class="text-neutral-300"
                  >Score
                  <span id="scoreCount" class="font-semibold text-emerald-300">0</span>
                </span>
              </div>

              <!-- questions -->
              <div id="questionList" class="mt-6 flex max-w-3xl flex-col gap-5"></div>

              <!-- submit -->
              <div class="mt-8 max-w-3xl">
                <p
                  id="submitHint"
                  class="mb-3 text-sm text-neutral-400"
                ></p>
                <p
                  id="submitError"
                  class="mb-3 hidden rounded-xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-200"
                ></p>
                <button
                  id="submitBtn"
                  type="button"
                  disabled
                  class="w-full cursor-pointer rounded-lg bg-linear-to-b from-white to-slate-200 px-5 py-3 text-sm font-medium text-black transition hover:from-slate-100 hover:to-slate-300 disabled:cursor-not-allowed disabled:from-neutral-500 disabled:to-neutral-600 disabled:text-neutral-300 disabled:opacity-60 sm:w-auto"
                >
                  Submit
                </button>
              </div>
            </div>
          </div>
        </main>

        <!-- footer -->
        <footer
          class="flex flex-wrap items-center justify-between gap-3 border-t border-white/5 px-6 py-5 text-xs text-neutral-500"
        >
          <p>© 2026 Highkey. All rights reserved.</p>
          <div id="footerLinks" class="flex flex-wrap gap-6">
            <a href="/about" class="transition hover:text-white">About Us</a>
            <a href="/help" class="transition hover:text-white">Help</a>
            <a href="/policy" class="transition hover:text-white"
              >Privacy Policy</a
            >
            <a href="/terms" class="transition hover:text-white">Terms</a>
          </div>
        </footer>
      </div>
    </div>

    <script>
      const loadingEl = document.getElementById("shimmer");
      const contentEl = document.getElementById("aftershimmer");

      // ---------- icons ----------
      const icons = {
        home: `<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />`,
        book: `<path d="M12 7v14" /><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />`,
        notes: `<path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4" /><path d="M2 6h4" /><path d="M2 10h4" /><path d="M2 14h4" /><path d="M2 18h4" /><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" />`,
        help: `<circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" />`,
        test: `<rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="m9 14 2 2 4-4" />`,
        copy: `<rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />`,
        support: `<circle cx="12" cy="12" r="10" /><path d="m4.93 4.93 4.24 4.24" /><path d="m14.83 9.17 4.24-4.24" /><path d="m14.83 14.83 4.24 4.24" /><path d="m9.17 14.83-4.24 4.24" /><circle cx="12" cy="12" r="4" />`,
        search: `<circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />`,
        crown: `<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" /><path d="M5 21h14" />`,
        chevron: `<path d="m6 9 6 6 6-6" />`,
        menu: `<path d="M4 6h16" /><path d="M4 12h16" /><path d="M4 18h16" />`,
        close: `<path d="M18 6 6 18" /><path d="m6 6 12 12" />`,
        check: `<path d="M20 6 9 17l-5-5" />`,
      };

      function icon(name, cls = "h-5 w-5") {
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${icons[name]}</svg>`;
      }

      // ---------- navigation ----------
      // this page belongs under "Practice Questions", so that item is highlighted.
      const activeHref = "/practice";

      const navItems = [
        { label: "Home", icon: "home", href: "/" },
        { label: "Books", icon: "book", href: "/books" },
        { label: "Notes", icon: "notes", href: "/notes" },
        { label: "Practice Questions", icon: "help", href: "/practice" },
        { label: "Test", icon: "test", href: "/test" },
        { label: "PYQ", icon: "copy", href: "/pyq" },
      ];

      function sidebarHTML() {
        const items = navItems
          .map((item) =>
            item.href === activeHref
              ? `<a href="${item.href}" class="flex items-center gap-3 rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-medium text-white">${icon(item.icon, "h-4 w-4 text-indigo-300")}${item.label}</a>`
              : `<a href="${item.href}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-neutral-400 transition hover:bg-white/5 hover:text-white">${icon(item.icon, "h-4 w-4")}${item.label}</a>`,
          )
          .join("");

        return `
          <div class="flex items-center gap-2 px-5 py-5">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" class="h-6 w-6">
              <path d="M12 3 2.5 21h19L12 3Z" />
              <path d="m12 9-4 12M12 9l4 12" />
            </svg>
            <span class="text-xl font-medium tracking-tight">Highkey</span>
          </div>
          <nav class="flex flex-col gap-1 px-3 py-2">
            ${items}
            <div class="my-2 border-t border-white/5"></div>
            <a href="/help" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-neutral-400 transition hover:bg-white/5 hover:text-white">${icon("support", "h-4 w-4")}Help</a>
          </nav>
          <p class="mt-auto px-5 py-5 text-xs text-neutral-500">Your space for what’s next.</p>`;
      }

      document.getElementById("desktopSidebar").innerHTML = sidebarHTML();
      document.getElementById("mobileSidebarContent").innerHTML = sidebarHTML();

      document.querySelectorAll("[data-icon]").forEach((el) => {
        el.innerHTML = icon(el.dataset.icon, el.dataset.class);
      });

      // ---------- paper ----------
      const paperMeta = document.getElementById("paperMeta");
      const paperMessage = document.getElementById("paperMessage");
      const paperBody = document.getElementById("paperBody");
      const questionList = document.getElementById("questionList");
      const answeredCountEl = document.getElementById("answeredCount");
      const totalCountEl = document.getElementById("totalCount");
      const scoreCountEl = document.getElementById("scoreCount");
      const submitBtn = document.getElementById("submitBtn");
      const submitHint = document.getElementById("submitHint");
      const submitError = document.getElementById("submitError");
      const searchInput = document.getElementById("searchInput");

      const OPTION_KEYS = ["option_a", "option_b", "option_c", "option_d"];
      const LETTERS = { option_a: "A", option_b: "B", option_c: "C", option_d: "D" };

      const STYLE = {
        base: "flex w-full items-start gap-3 rounded-xl border px-4 py-3 text-left text-sm transition",
        idle: "cursor-pointer border-white/10 bg-white/5 text-neutral-200 hover:border-white/25 hover:bg-white/10",
        correct: "cursor-default border-emerald-500/60 bg-emerald-500/15 text-emerald-100",
        wrong: "cursor-default border-rose-500/60 bg-rose-500/15 text-rose-100",
        dim: "cursor-default border-white/5 bg-white/5 text-neutral-400 opacity-60",
      };

      // state for the whole paper
      let questions = []; // [{ node, options: {key: btn}, correctKey, answered, isRight, text }]
      let testUuid = "";
      let submitting = false;

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function showMessage(text) {
        paperMessage.textContent = text;
        paperMessage.classList.remove("hidden");
      }

      function revealPage() {
        loadingEl.classList.add("hidden");
        contentEl.classList.remove("hidden");
      }

      function skeletonCardHTML() {
        return `
          <div class="shimmer flex flex-col gap-3 rounded-2xl border border-white/10 bg-neutral-900/70 p-5 shadow-xl shadow-black/40">
            <div class="h-4 w-24 rounded-md bg-white/10"></div>
            <div class="h-6 w-full rounded-md bg-white/5"></div>
            <div class="h-11 w-full rounded-xl bg-white/5"></div>
            <div class="h-11 w-full rounded-xl bg-white/5"></div>
            <div class="h-11 w-full rounded-xl bg-white/5"></div>
            <div class="h-11 w-full rounded-xl bg-white/5"></div>
          </div>`;
      }
      document.getElementById("pageSkeletonList").innerHTML =
        skeletonCardHTML().repeat(3);

      // "option_a" / "a" / "A" / "Option A" -> "option_a"
      function normalizeCorrect(value) {
        const v = String(value ?? "").toLowerCase().trim();
        const m = /(?:option[\s_-]*)?([a-d])$/.exec(v);
        return m ? "option_" + m[1] : "";
      }

      function updateProgress() {
        const total = questions.length;
        const answered = questions.filter((q) => q.answered).length;
        const score = questions.filter((q) => q.isRight).length;

        answeredCountEl.textContent = answered;
        totalCountEl.textContent = total;
        scoreCountEl.textContent = `${score} / ${total}`;

        const done = total > 0 && answered === total;
        submitBtn.disabled = !done || submitting || !testUuid;
        if (!testUuid) {
          submitHint.textContent = "This paper has no test id, so it can’t be submitted.";
        } else if (done) {
          submitHint.textContent = "All questions answered. Submit your score when you’re ready.";
        } else {
          submitHint.textContent = `Answer all questions to submit (${total - answered} left).`;
        }
      }

      function answer(q, chosenKey) {
        if (q.answered) return; // one try per question
        q.answered = true;
        q.isRight = chosenKey === q.correctKey;

        for (const [key, btn] of Object.entries(q.options)) {
          btn.disabled = true;
          let state = "dim";
          let mark = "";
          if (key === q.correctKey) {
            state = "correct";
            mark = icon("check", "h-4 w-4 shrink-0");
          } else if (key === chosenKey) {
            state = "wrong";
            mark = icon("close", "h-4 w-4 shrink-0");
          }
          btn.className = STYLE.base + " " + STYLE[state];
          if (mark) btn.insertAdjacentHTML("beforeend", mark);
        }

        // result + explanation
        const box = el(
          "div",
          "mt-1 rounded-xl border px-4 py-3 " +
            (q.isRight
              ? "border-emerald-500/30 bg-emerald-500/5"
              : "border-rose-500/30 bg-rose-500/5"),
        );
        const status = q.correctKey
          ? q.isRight
            ? "Correct!"
            : `Wrong. Correct answer: ${LETTERS[q.correctKey]}`
          : q.isRight
            ? "Correct!"
            : "Wrong.";
        box.appendChild(
          el(
            "p",
            "text-xs font-semibold tracking-wide uppercase " +
              (q.isRight ? "text-emerald-300" : "text-rose-300"),
            status,
          ),
        );
        if (q.explain) {
          box.appendChild(el("p", "mt-1 text-sm leading-6 text-neutral-300", q.explain));
        }
        q.node.appendChild(box);

        updateProgress();
      }

      function questionCard(item, index, total) {
        const text = String(item.question ?? "");
        const correctKey = normalizeCorrect(item.correct);
        const explain = String(item.explain ?? "").trim();

        const node = el(
          "div",
          "flex flex-col gap-3 rounded-2xl border border-white/10 bg-linear-to-b from-neutral-800/60 via-neutral-950 to-neutral-900 p-5 shadow-xl shadow-black/40",
        );

        node.appendChild(
          el(
            "p",
            "text-xs font-medium tracking-wide text-indigo-300",
            `Question ${index + 1} of ${total}`,
          ),
        );
        node.appendChild(
          el("h3", "text-base leading-7 font-medium whitespace-pre-line", text),
        );

        const q = {
          node,
          options: {},
          correctKey,
          explain,
          answered: false,
          isRight: false,
          text: text.toLowerCase(),
        };

        for (const key of OPTION_KEYS) {
          const optText = item[key];
          if (optText === null || optText === undefined || String(optText).trim() === "")
            continue;

          const btn = el("button", STYLE.base + " " + STYLE.idle);
          btn.type = "button";
          btn.appendChild(
            el(
              "span",
              "flex h-6 w-6 shrink-0 items-center justify-center rounded-full border border-current/30 text-xs font-semibold",
              LETTERS[key],
            ),
          );
          btn.appendChild(el("span", "min-w-0 flex-1 leading-6", String(optText)));
          btn.addEventListener("click", () => answer(q, key));

          q.options[key] = btn;
          node.appendChild(btn);
        }

        q.text += " " + Object.keys(q.options).map((k) => String(item[k]).toLowerCase()).join(" ");
        return q;
      }

      // ---------- load the paper ----------
      async function loadPaper() {
        // pass the same queries this page was opened with
        const incoming = new URLSearchParams(window.location.search);
        const params = new URLSearchParams();
        for (const key of ["subject", "chapter", "test"]) {
          if (incoming.has(key)) params.set(key, incoming.get(key));
        }

        const subject = params.get("subject") || "";
        if (!subject) {
          showMessage("No practice paper selected. Go back and choose one.");
          revealPage();
          return;
        }

        paperMeta.textContent = [
          subject,
          params.get("chapter"),
          params.get("test") ? "Practice paper " + params.get("test") : "",
        ]
          .filter(Boolean)
          .join(" · ");

        try {
          const res = await fetch("/getpaperpractice?" + params.toString());

          if (res.status === 401) {
            window.location.href = "/login";
            return;
          }
          if (!res.ok) throw new Error("Failed to load paper");

          const data = await res.json();

          // rows can be a bare array or sit under questions / papers / data
          const rows = Array.isArray(data)
            ? data
            : data.questions || data.papers || data.data || [];
          testUuid = String(
            (!Array.isArray(data) && data.test_uuid) ||
              (rows[0] && rows[0].test_uuid) ||
              "",
          );

          if (rows.length === 0) {
            showMessage("No questions available for this paper yet.");
          } else {
            questions = rows.map((row, i) => questionCard(row, i, rows.length));
            questionList.replaceChildren(...questions.map((q) => q.node));
            paperBody.classList.remove("hidden");
            updateProgress();
          }
        } catch (error) {
          console.error("Error loading paper:", error);
          showMessage("We couldn’t load this paper right now. Please try again.");
        }

        revealPage();
      }
      loadPaper();

      // ---------- search (hides questions that don't match; score is unaffected) ----------
      searchInput.addEventListener("input", () => {
        const q = searchInput.value.toLowerCase().trim();
        for (const item of questions) {
          item.node.style.display = !q || item.text.includes(q) ? "" : "none";
        }
      });

      // ---------- submit ----------
      submitBtn.addEventListener("click", async () => {
        if (submitting || submitBtn.disabled) return;
        submitting = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting…";
        submitError.classList.add("hidden");

        const score = questions.filter((q) => q.isRight).length;

        try {
          const res = await fetch("/submitpracticescore", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ test_uuid: testUuid, score }),
          });

          if (res.status === 401) {
            window.location.href = "/login";
            return;
          }

          let data = null;
          try {
            data = await res.json();
          } catch {}

          if (!res.ok || (data && data.success === false)) {
            throw new Error((data && data.message) || "Submit failed");
          }

          window.location.href = "/ssc";
        } catch (error) {
          console.error("Error submitting score:", error);
          submitError.textContent =
            "We couldn’t submit your score. Please try again.";
          submitError.classList.remove("hidden");
          submitting = false;
          submitBtn.textContent = "Submit";
          updateProgress();
        }
      });

      // ---------- mobile sidebar ----------
      const overlay = document.getElementById("mobileOverlay");
      const openSidebar = () => overlay.classList.remove("hidden");
      const closeSidebar = () => overlay.classList.add("hidden");

      document
        .getElementById("openSidebar")
        .addEventListener("click", openSidebar);
      document
        .getElementById("closeSidebar")
        .addEventListener("click", closeSidebar);
      document
        .getElementById("overlayBackdrop")
        .addEventListener("click", closeSidebar);
      document
        .getElementById("mobileSidebarContent")
        .querySelectorAll("a")
        .forEach((a) => a.addEventListener("click", closeSidebar));

      // ---------- profile menu ----------
      const profileWrap = document.getElementById("profileWrap");
      const profileMenu = document.getElementById("profileMenu");

      document.getElementById("profileBtn").addEventListener("click", () => {
        profileMenu.classList.toggle("hidden");
      });

      document.addEventListener("mousedown", (e) => {
        if (!profileWrap.contains(e.target))
          profileMenu.classList.add("hidden");
      });

      // ---------- user info (header profile) ----------
      async function getUserInfo() {
        try {
          const res = await fetch("/userinfo");
          const data = await res.json();

          if (!data.success) {
            window.location.href = "/login";
            return;
          }
          document.getElementById("userName").textContent = data.username;
          document.getElementById("userEmail").textContent = data.useremail;
          document.getElementById("avatar").textContent = data.username
            ? data.username.charAt(0).toUpperCase()
            : "";
        } catch (err) {
          console.error("Could not load user info", err);
        }
      }
      getUserInfo();
    </script>
  </body>
</html>
