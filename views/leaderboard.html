<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard - Highkey</title>
    <link rel="stylesheet" href="/output.css" />
  </head>
  <body>
    <!--
      Palette
      Blue   #2878F0  primary buttons
      Green  #34D399  scores
      Yellow #FBBF24  1st place, highlights
      Navy   #0B1220  main background
      Slate  #172337  cards and surfaces
    -->
    <div class="min-h-screen bg-[#0B1220] text-slate-100">
      <!-- back + search (sticky, no header / footer / sidebar) -->
      <div class="sticky top-0 z-10 border-b border-white/5 bg-[#0B1220]/90 backdrop-blur">
        <div class="mx-auto flex w-full max-w-3xl items-center gap-2.5 px-4 py-3 sm:px-6">
          <a href="/" aria-label="Back to dashboard" class="flex shrink-0 cursor-pointer items-center gap-1.5 rounded-full bg-[#2878F0] px-3.5 py-2 text-sm font-semibold text-white shadow-lg shadow-[#2878F0]/30 transition hover:brightness-110">
            <span data-icon="back" data-class="h-4 w-4"></span>
            <span class="hidden sm:inline">Back</span>
          </a>
          <div class="relative min-w-0 flex-1">
            <span class="absolute top-1/2 left-3 -translate-y-1/2 text-slate-500">
              <span data-icon="search" data-class="h-4 w-4"></span>
            </span>
            <input
              id="searchInput"
              type="text"
              autocomplete="off"
              placeholder="Search by username..."
              class="w-full rounded-full border border-white/5 bg-[#172337] py-2 pr-9 pl-10 text-sm text-white placeholder-slate-500 outline-none transition focus:border-[#2878F0] focus:ring-4 focus:ring-[#2878F0]/20"
            />
            <button id="clearSearch" type="button" aria-label="Clear search" class="absolute top-1/2 right-3 hidden -translate-y-1/2 cursor-pointer text-slate-500 transition hover:text-white">
              <span data-icon="close" data-class="h-4 w-4"></span>
            </button>
          </div>
        </div>
      </div>

      <main class="mx-auto w-full max-w-3xl px-4 pt-4 pb-10 sm:px-6">
        <div class="mb-3 flex items-center justify-between">
          <h1 class="flex items-center gap-2 text-lg font-bold">
            <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#FBBF24] text-[#0B1220]" data-icon="trophy" data-class="h-4 w-4"></span>
            Leaderboard
          </h1>
          <span id="countText" class="rounded-full bg-[#2878F0]/15 px-3 py-1 text-xs font-semibold text-[#6aa5ff]"></span>
        </div>

        <div id="leaderboard" class="flex flex-col gap-2 rounded-2xl border border-white/5 bg-[#172337] p-3 shadow-lg shadow-black/30">
          <p class="py-10 text-center text-sm text-slate-500">Loading leaderboard...</p>
        </div>

        <div id="moreWrap" class="mt-3 hidden justify-center">
          <button id="moreBtn" type="button" class="cursor-pointer rounded-full bg-[#2878F0] px-6 py-2 text-sm font-semibold text-white shadow-lg shadow-[#2878F0]/30 transition hover:brightness-110">Show more</button>
        </div>
      </main>
    </div>

    <script>
      // ---------- icons ----------
      const icons = {
        search: `<circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />`,
        trophy: `<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />`,
        back: `<path d="m12 19-7-7 7-7" /><path d="M19 12H5" />`,
        close: `<path d="M18 6 6 18" /><path d="m6 6 12 12" />`,
      };

      function icon(name, cls = "h-5 w-5") {
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${icons[name]}</svg>`;
      }

      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      document.querySelectorAll("[data-icon]").forEach((el) => {
        el.innerHTML = icon(el.dataset.icon, el.dataset.class);
      });

      // ---------- styles (same as the dashboard leaderboard) ----------
      // index 0 = 1st ... index 9 = 10th. Everyone after 10th uses the last style.
      const lbStyles = [
        { row: "p-5 bg-linear-to-r from-[#FBBF24] to-[#f59e0b] text-[#0B1220] shadow-xl shadow-[#FBBF24]/25 ring-2 ring-[#FBBF24]/50", badge: "h-14 w-14 text-2xl bg-[#0B1220] text-[#FBBF24]", avatar: "h-14 w-14 text-2xl bg-[#0B1220]/15 text-[#0B1220]", name: "text-2xl sm:text-3xl font-extrabold", stat: "text-sm", score: "text-3xl sm:text-4xl font-extrabold", sub: "text-[#0B1220]/70", medal: "👑" },
        { row: "p-4 bg-linear-to-r from-[#2878F0] to-[#1d4fb8] text-white shadow-lg shadow-[#2878F0]/25", badge: "h-12 w-12 text-xl bg-white text-[#2878F0]", avatar: "h-12 w-12 text-xl bg-white/20 text-white", name: "text-xl sm:text-2xl font-bold", stat: "text-sm", score: "text-2xl sm:text-3xl font-bold", sub: "text-blue-100", medal: "🥈" },
        { row: "p-3.5 bg-linear-to-r from-[#34D399] to-[#10b981] text-[#0B1220] shadow-lg shadow-[#34D399]/20", badge: "h-10 w-10 text-lg bg-[#0B1220] text-[#34D399]", avatar: "h-10 w-10 text-lg bg-[#0B1220]/15 text-[#0B1220]", name: "text-lg sm:text-xl font-bold", stat: "text-xs", score: "text-xl sm:text-2xl font-bold", sub: "text-[#0B1220]/70", medal: "🥉" },
        { row: "p-3 bg-[#0B1220]/70 border border-white/5 text-white", badge: "h-9 w-9 text-base bg-[#2878F0]/20 text-[#6aa5ff]", avatar: "h-9 w-9 text-base bg-white/5 text-slate-300", name: "text-base font-semibold", stat: "text-xs", score: "text-lg font-bold text-[#34D399]", sub: "text-slate-400", medal: "" },
        { row: "p-3 bg-[#0B1220]/70 border border-white/5 text-white", badge: "h-8 w-8 text-sm bg-[#2878F0]/20 text-[#6aa5ff]", avatar: "h-8 w-8 text-sm bg-white/5 text-slate-300", name: "text-[15px] font-semibold", stat: "text-xs", score: "text-base font-bold text-[#34D399]", sub: "text-slate-400", medal: "" },
        { row: "px-3 py-2.5 bg-[#0B1220]/70 border border-white/5 text-white", badge: "h-8 w-8 text-sm bg-[#2878F0]/20 text-[#6aa5ff]", avatar: "h-8 w-8 text-sm bg-white/5 text-slate-300", name: "text-sm font-semibold", stat: "text-xs", score: "text-base font-bold text-[#34D399]", sub: "text-slate-400", medal: "" },
        { row: "px-3 py-2 bg-[#0B1220]/70 border border-white/5 text-white", badge: "h-7 w-7 text-xs bg-[#2878F0]/20 text-[#6aa5ff]", avatar: "h-7 w-7 text-xs bg-white/5 text-slate-300", name: "text-sm font-medium", stat: "text-[11px]", score: "text-sm font-bold text-[#34D399]", sub: "text-slate-400", medal: "" },
        { row: "px-3 py-2 bg-[#0B1220]/70 border border-white/5 text-white", badge: "h-7 w-7 text-xs bg-[#2878F0]/20 text-[#6aa5ff]", avatar: "h-7 w-7 text-xs bg-white/5 text-slate-300", name: "text-[13px] font-medium", stat: "text-[11px]", score: "text-sm font-bold text-[#34D399]", sub: "text-slate-400", medal: "" },
        { row: "px-3 py-1.5 bg-[#0B1220]/70 border border-white/5 text-white", badge: "h-6 w-6 text-[11px] bg-[#2878F0]/20 text-[#6aa5ff]", avatar: "h-6 w-6 text-[11px] bg-white/5 text-slate-300", name: "text-xs font-medium", stat: "text-[10px]", score: "text-xs font-bold text-[#34D399]", sub: "text-slate-400", medal: "" },
        { row: "px-3 py-1.5 bg-[#0B1220]/70 border border-white/5 text-white", badge: "h-6 w-6 text-[11px] bg-[#2878F0]/20 text-[#6aa5ff]", avatar: "h-6 w-6 text-[11px] bg-white/5 text-slate-300", name: "text-xs font-medium", stat: "text-[10px]", score: "text-xs font-bold text-[#34D399]", sub: "text-slate-400", medal: "" },
      ];

      // ---------- state ----------
      const PAGE_SIZE = 50; // rows drawn at a time (keeps big lists fast)
      let all = []; // everyone, in rank order: { ...student, rank }
      let filtered = []; // after search
      let shown = 0;

      const box = document.getElementById("leaderboard");
      const moreWrap = document.getElementById("moreWrap");
      const countText = document.getElementById("countText");

      function rowHTML(s) {
        // the style comes from the real rank, so search results keep their look
        const st = lbStyles[Math.min(s.rank, lbStyles.length) - 1];
        const avg = Number(s.final_score);
        const avgText = Number.isFinite(avg) ? avg.toFixed(1) : "0.0";
        const tests = (Number(s.totaltest) || 0) + (Number(s.totalpractice) || 0);
        const initial = s.username ? String(s.username).charAt(0).toUpperCase() : "?";
        return `
          <div class="flex items-center gap-3 rounded-2xl transition hover:scale-[1.01] ${st.row}">
            <span class="flex shrink-0 items-center justify-center rounded-full font-extrabold ${st.badge}">${esc(s.rank)}</span>
            <span class="hidden shrink-0 items-center justify-center rounded-full font-bold sm:flex ${st.avatar}">${esc(initial)}</span>
            <div class="min-w-0 flex-1">
              <p class="truncate ${st.name}">${esc(s.username)} ${st.medal}</p>
              <p class="${st.stat} ${st.sub}">${tests} ${tests === 1 ? "test" : "tests"} taken</p>
            </div>
            <div class="shrink-0 text-right">
              <p class="leading-none ${st.score}">${avgText}</p>
              <p class="mt-0.5 ${st.stat} ${st.sub}">Score</p>
            </div>
          </div>`;
      }

      function draw(reset) {
        if (reset) {
          shown = 0;
          box.innerHTML = "";
        }

        if (filtered.length === 0) {
          box.innerHTML = `<p class="py-10 text-center text-sm text-slate-500">${all.length ? "No students match your search." : "No leaderboard data yet."}</p>`;
          moreWrap.classList.add("hidden");
          moreWrap.classList.remove("flex");
          countText.textContent = all.length ? "0 found" : "";
          return;
        }

        const next = filtered.slice(shown, shown + PAGE_SIZE);
        box.insertAdjacentHTML("beforeend", next.map(rowHTML).join(""));
        shown += next.length;

        const more = shown < filtered.length;
        moreWrap.classList.toggle("hidden", !more);
        moreWrap.classList.toggle("flex", more);
        countText.textContent = filtered.length === all.length ? `${all.length} students` : `${filtered.length} of ${all.length}`;
      }

      // ---------- search ----------
      const input = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearSearch");
      let searchTimer = null;

      function applySearch() {
        const q = input.value.trim().toLowerCase();
        clearBtn.classList.toggle("hidden", q === "");
        filtered = q ? all.filter((s) => String(s.username ?? "").toLowerCase().includes(q)) : all;
        draw(true);
      }

      input.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applySearch, 150);
      });
      clearBtn.addEventListener("click", () => {
        input.value = "";
        applySearch();
        input.focus();
      });
      document.getElementById("moreBtn").addEventListener("click", () => draw(false));

      // ---------- load ----------
      async function loadLeaderboard() {
        try {
          const res = await fetch("/finalleaderboard");
          if (res.status === 401) {
            window.location.href = "/login";
            return;
          }
          const data = await res.json();
          // accepts a plain array, or { data: [...] } / { leaderboard: [...] }
          const list = Array.isArray(data) ? data : data.data || data.leaderboard || [];
          // rank comes from the server; fall back to the position in the list
          all = list.map((s, i) => ({ ...s, rank: Number(s.rank) || i + 1 }));
          filtered = all;
          draw(true);
        } catch (err) {
          console.error("Could not load leaderboard", err);
          box.innerHTML = `<p class="py-10 text-center text-sm text-slate-500">Could not load leaderboard.</p>`;
        }
      }
      loadLeaderboard();
    </script>
  </body>
</html>
